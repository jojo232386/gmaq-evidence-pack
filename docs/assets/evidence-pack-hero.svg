<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">GMAQ Evidence Pack</title>
  <desc id="desc">Dark blue banner showing Freqtrade exports moving through offline evidence preflight into a review verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#0f2840"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1440" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="460" rx="28" fill="url(#grid)"/>

  <g transform="translate(76 62)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="166" height="34" rx="17" fill="#0e7490" fill-opacity="0.24" stroke="#22d3ee" stroke-opacity="0.75"/>
    <text x="83" y="22" text-anchor="middle" fill="#cffafe" font-size="13" font-weight="700" letter-spacing="1.2">FT PREFLIGHT</text>
    <text x="0" y="132" fill="#f8fafc" font-size="66" font-weight="800" letter-spacing="-3">GMAQ Evidence Pack</text>
    <rect x="0" y="154" width="500" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="0" y="211" fill="#cbd5e1" font-size="27" font-weight="500">Evidence checks before strategy review</text>
    <text x="0" y="251" fill="#94a3b8" font-size="18">Native ZIPs · Lookahead · Provenance · Public summary</text>
    <g transform="translate(0 294)">
      <rect width="184" height="52" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="92" y="32" text-anchor="middle" fill="#cffafe" font-size="14" font-weight="700">OFFLINE</text>
      <g transform="translate(200 0)">
        <rect width="184" height="52" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.6"/>
        <text x="92" y="32" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="700">STANDARD LIBRARY</text>
      </g>
      <g transform="translate(400 0)">
        <rect width="204" height="52" rx="12" fill="#0f2f2a" stroke="#34d399" stroke-opacity="0.7"/>
        <text x="102" y="32" text-anchor="middle" fill="#d1fae5" font-size="14" font-weight="700">INTERNAL SAMPLE</text>
      </g>
    </g>
  </g>

  <g transform="translate(760 103)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M150 76H244M406 76H500" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <g>
      <rect width="150" height="152" rx="22" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.75"/>
      <path d="M48 43H102M48 59H92M48 75H84" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <text x="75" y="116" text-anchor="middle" fill="#cffafe" font-size="15" font-weight="700">EXPORTS</text>
    </g>
    <g transform="translate(244 0)">
      <rect width="162" height="152" rx="22" fill="#10243b" stroke="#60a5fa" stroke-opacity="0.75"/>
      <circle cx="81" cy="58" r="27" fill="#1d4ed8" fill-opacity="0.24" stroke="#60a5fa"/>
      <path d="M69 58L78 67L96 48" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="81" y="116" text-anchor="middle" fill="#dbeafe" font-size="15" font-weight="700">PREFLIGHT</text>
    </g>
    <g transform="translate(500 0)">
      <rect width="166" height="152" rx="22" fill="#0f2f2a" stroke="#34d399" stroke-opacity="0.8"/>
      <circle cx="83" cy="58" r="27" fill="#059669" fill-opacity="0.25" stroke="#34d399"/>
      <path d="M71 58L80 67L98 48" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="83" y="111" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">PASS FOR</text>
      <text x="83" y="130" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">REVIEW</text>
    </g>
    <text x="333" y="203" text-anchor="middle" fill="#94a3b8" font-size="16">No exchange · No strategy grading · No order path</text>
  </g>
</svg>
