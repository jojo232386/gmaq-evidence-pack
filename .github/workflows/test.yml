name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate diff
        run: git diff --check
      - name: Compile
        run: python -m py_compile gmaq_evidence_pack.py scripts/gmaq-evidence-pack
      - name: Test
        run: python -m unittest discover -s tests -v
